<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🔏 پنل مدیر</title>
<style>
/* Glassmorphism theme. Light + dark follow the OS. Mobile-first: base styles are phone, @media widens. */
/* Palette: Dark #081528/#0F203A · Gold #BFA46F/#FBD57F · Blue #165EF6/#A4B9E4/#32568A · State #4CD8B9/#D65959/#CFA44B/#BBF0E4/#EFC9C9 */
:root{
  /* light mode: palette tints on a pale blue base */
  --ink:#081528;--mut:#32568A;
  --glass:rgba(255,255,255,.58);--glass-strong:rgba(255,255,255,.82);--edge:rgba(255,255,255,.8);--line:rgba(50,86,138,.25);
  --field:rgba(255,255,255,.75);
  --acc:#165EF6;--acc2:#32568A;--gold:#BFA46F;--gold2:#FBD57F;
  --ok:#4CD8B9;--bad:#D65959;--warn:#CFA44B;
  --ok-t:#14705C;--bad-t:#A83A3A;--warn-t:#7A5C12;
  --shadow:0 8px 32px rgba(8,21,40,.14);
  --bg:#DCE6F8;--orb1:#A4B9E4;--orb2:#BBF0E4;--orb3:#FBD57F;
}
@media (prefers-color-scheme:dark){:root{
  --ink:#F4F7FF;--mut:#A4B9E4;
  --glass:rgba(15,32,58,.55);--glass-strong:rgba(15,32,58,.82);--edge:rgba(164,185,228,.2);--line:rgba(164,185,228,.22);
  --field:rgba(8,21,40,.6);
  --acc:#165EF6;--acc2:#32568A;--gold:#BFA46F;--gold2:#FBD57F;
  --ok:#4CD8B9;--bad:#D65959;--warn:#CFA44B;
  --ok-t:#BBF0E4;--bad-t:#EFC9C9;--warn-t:#FBD57F;
  --shadow:0 8px 32px rgba(0,0,0,.5);
  --bg:#081528;--orb1:#165EF6;--orb2:#32568A;--orb3:#BFA46F;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);background:var(--bg);
  font:15px/1.75 Vazirmatn,Tahoma,"Segoe UI",system-ui,-apple-system,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
/* soft colour orbs behind the glass */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(40vmax 40vmax at 90% 5%,color-mix(in srgb,var(--orb1) 55%,transparent),transparent 60%),
   radial-gradient(45vmax 45vmax at 5% 40%,color-mix(in srgb,var(--orb2) 60%,transparent),transparent 60%),
   radial-gradient(40vmax 40vmax at 80% 100%,color-mix(in srgb,var(--orb3) 35%,transparent),transparent 60%)}

header,.card{background:var(--glass);border:1px solid var(--edge);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.35);
  -webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){header,.card{background:var(--glass-strong)}}

header{border-top:2px solid var(--gold);position:sticky;top:0;z-index:5;margin:10px 12px 0;padding:12px 16px;border-radius:18px}
h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.2px}
main{max-width:820px;margin:0 auto;padding:12px}
.card{border-radius:20px;padding:16px;margin-bottom:14px}
h2{margin:0 0 8px;font-size:16px;font-weight:700;border-inline-start:3px solid var(--gold);padding-inline-start:10px}
h3{font-weight:600}
label{display:block;margin:12px 0 5px;color:var(--mut);font-size:13px}
summary{cursor:pointer;font-weight:600;list-style-position:inside}

input,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=password],textarea{width:100%;padding:11px 13px;font-size:16px; /* 16px stops iOS zoom-on-focus */
  border:1px solid var(--line);border-radius:12px;background:var(--field);outline:none;transition:border-color .15s,box-shadow .15s}
input[type=text]:focus,input[type=password]:focus,textarea:focus{border-color:var(--gold2);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold2) 28%,transparent)}
textarea{min-height:140px;resize:vertical}
input[type=file]{width:100%;font-size:14px;color:var(--mut)}
input[type=file]::file-selector-button{margin-inline-end:10px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--field);color:var(--ink);cursor:pointer;font:inherit;font-size:13px}
input[type=radio]{accent-color:var(--acc);width:18px;height:18px}

button{padding:10px 16px;min-height:42px;border:1px solid var(--line);border-radius:999px;background:var(--glass-strong);cursor:pointer;
  transition:transform .12s,box-shadow .15s,opacity .15s;touch-action:manipulation}
button:hover:not(:disabled){box-shadow:0 4px 14px rgba(22,94,246,.25)}
button:active:not(:disabled){transform:scale(.97)}
button.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:color-mix(in srgb,var(--gold) 55%,transparent);color:#fff;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.3)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,summary:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}

.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row>button{flex:1 1 100%}   /* phone: full-width, thumb-friendly buttons */
.row>input[type=file]{flex:1 1 100%}

.tabs{display:flex;gap:4px;padding:4px;margin-bottom:14px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.tabs button{flex:1;border:0;background:transparent;box-shadow:none;min-height:40px;padding:8px 6px;font-size:14px;color:var(--mut)}
.tabs button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(22,94,246,.4)}

.msg{margin-top:10px;padding:10px 12px;border-radius:12px;font-size:14px;display:none;word-break:break-word;white-space:pre-wrap;border:1px solid transparent}
.msg.ok{display:block;background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok-t);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.msg.bad{display:block;background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad-t);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.msg.warn{display:block;background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn-t);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.msg.info{display:block;background:color-mix(in srgb,var(--mut) 10%,transparent);color:var(--mut)}

.preview canvas{width:100%;height:auto;border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:12px;box-shadow:var(--shadow)}
.pad{width:100%;height:170px;border:1.5px dashed var(--mut);border-radius:14px;background:#fff;touch-action:none;display:block}
.radios{display:flex;gap:8px 18px;flex-wrap:wrap}
.radios label{display:flex;gap:7px;align-items:center;margin:0;color:var(--ink);font-size:15px;padding:6px 0}
code{direction:ltr;unicode-bidi:embed;background:color-mix(in srgb,var(--mut) 15%,transparent);padding:1px 7px;border-radius:6px;word-break:break-all;font-size:.9em}
.hidden{display:none!important}

@media (min-width:600px){
  header{margin:14px auto 0;max-width:796px}
  main{padding:16px}
  .card{padding:22px}
  .row>button,.row>input[type=file]{flex:0 1 auto}
  .row>input[type=file]{width:auto}
  .pad{height:200px}
  .tabs button{font-size:15px}
}

/* ---- print: show only the letter image (#printArea must be a direct child of <body>) ---- */
#printArea{display:none}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important}
  body::before{display:none}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  #printArea img{display:block;width:100%;height:auto}
}

</style>
</head>
<body>
<header><h1>🔏 پنل مدیر</h1></header>
<main>
<div class="card">
  <h2>۱. کلید مدیر</h2>
  <div id="keyStatus" class="msg info">قفل است.</div>
  <h3 style="font-size:14px;margin:14px 0 0">باز کردن کلید موجود</h3>
  <label>فایل <code>.private</code></label><input type="file" id="keyFile" accept=".private,.key,application/json">
  <label>رمز</label><input type="password" id="unlockPass" autocomplete="off">
  <div class="row"><button id="unlock" class="primary">باز کردن</button></div>
  <div class="msg info" style="display:block">کلید ندارید؟ یک بار با <code>keygen.html</code> بسازید.</div>
  <div id="keyMsg" class="msg"></div>
</div>

<div class="card">
  <h2>۲. نامه‌ی دریافتی</h2>
  <label>فایل <code>.letter</code></label><input type="file" id="letterFile" accept=".letter,application/json">
  <div id="openMsg" class="msg"></div>
  <div id="mgrPreview" class="preview"></div>
</div>

<div class="card">
  <h2>۳. تصمیم و امضا</h2>
  <div class="radios">
    <label><input type="radio" name="decision" value="approved" checked> تأیید</label>
    <label><input type="radio" name="decision" value="revision"> نیاز به اصلاح</label>
    <label><input type="radio" name="decision" value="rejected"> رد</label>
  </div>
  <label id="noteLabel">توضیح (اختیاری)</label><textarea id="note" style="min-height:90px"></textarea>
  <label>تصویر امضا: روی کادر بکشید یا PNG بارگذاری کنید</label>
  <canvas id="pad" class="pad" width="600" height="180"></canvas>
  <div class="row">
    <input type="file" id="sigUpload" accept="image/*">
    <button id="padClear">پاک کردن</button>
  </div>
  <div class="row"><button id="signBtn" class="primary" disabled>امضا و دانلود فایل <bdi dir="ltr">(.signed)</bdi></button></div>
  <div id="signMsg" class="msg"></div>
</div>

</main>
<div id="printArea"><img id="printImg" alt=""></div>
<script>
// Pure WebCrypto layer: no DOM, runs in browsers and Node >= 19.
// Identity = ECDSA P-256 (sign) + ECDH P-256 (decrypt). Private part is password-wrapped.
const LC = (() => {
  const V = 1;
  const PBKDF2_ITER = 600000;
  const enc = new TextEncoder();
  const dec = new TextDecoder();
  const subtle = globalThis.crypto.subtle;
  const rand = (n) => globalThis.crypto.getRandomValues(new Uint8Array(n));

  const b64 = (buf) => {
    const u = new Uint8Array(buf);
    let s = '';
    for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i + 0x8000));
    return btoa(s);
  };
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const hex = (buf) => [...new Uint8Array(buf)].map((x) => x.toString(16).padStart(2, '0')).join('');

  const sortKeys = (v) => {
    if (Array.isArray(v)) return v.map(sortKeys);
    if (v && typeof v === 'object') return Object.fromEntries(Object.keys(v).sort().map((k) => [k, sortKeys(v[k])]));
    return v;
  };
  const canon = (o) => JSON.stringify(sortKeys(o));
  const sha256hex = async (text) => hex(await subtle.digest('SHA-256', enc.encode(text)));

  const pubJwk = (j) => ({ kty: j.kty, crv: j.crv, x: j.x, y: j.y });

  async function fingerprint(pub) {
    const h = await sha256hex(canon({ sign: pubJwk(pub.sign), enc: pubJwk(pub.enc) }));
    return h.slice(0, 32).match(/.{4}/g).join('-');
  }

  async function checkPub(pub) {
    if (!pub || pub.v !== V || !pub.sign || !pub.enc || pub.sign.kty !== 'EC' || pub.enc.kty !== 'EC') {
      throw new Error('فایل کلید عمومی نامعتبر است');
    }
    return { ...pub, fp: await fingerprint(pub) };
  }

  async function wrapKey(password, salt, usage) {
    const base = await subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    return subtle.deriveKey(
      { name: 'PBKDF2', hash: 'SHA-256', salt, iterations: PBKDF2_ITER },
      base, { name: 'AES-GCM', length: 256 }, false, usage);
  }

  async function generateIdentity(name, password) {
    const sign = await subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']);
    const encK = await subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveBits']);
    const pub = {
      v: V, name,
      sign: pubJwk(await subtle.exportKey('jwk', sign.publicKey)),
      enc: pubJwk(await subtle.exportKey('jwk', encK.publicKey)),
    };
    const priv = {
      sign: await subtle.exportKey('jwk', sign.privateKey),
      enc: await subtle.exportKey('jwk', encK.privateKey),
    };
    const salt = rand(16);
    const iv = rand(12);
    const key = await wrapKey(password, salt, ['encrypt']);
    const ct = await subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(canon(priv)));
    const keyFile = { v: V, type: 'key', name, pub, kdf: { salt: b64(salt), iter: PBKDF2_ITER }, iv: b64(iv), ct: b64(ct) };
    return { keyFile, pubFile: pub };
  }

  async function unlockIdentity(keyFile, password) {
    if (keyFile?.v !== V || keyFile.type !== 'key') throw new Error('فایل کلید نامعتبر است');
    const key = await wrapKey(password, unb64(keyFile.kdf.salt), ['decrypt']);
    let priv;
    try {
      priv = JSON.parse(dec.decode(await subtle.decrypt({ name: 'AES-GCM', iv: unb64(keyFile.iv) }, key, unb64(keyFile.ct))));
    } catch {
      throw new Error('رمز اشتباه است یا فایل کلید خراب است');
    }
    const pub = await checkPub(keyFile.pub);
    return {
      name: keyFile.name, pub, fp: pub.fp,
      signKey: await subtle.importKey('jwk', priv.sign, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['sign']),
      encKey: await subtle.importKey('jwk', priv.enc, { name: 'ECDH', namedCurve: 'P-256' }, false, ['deriveBits']),
    };
  }

  async function deriveAes(priv, pub, usage) {
    const bits = await subtle.deriveBits({ name: 'ECDH', public: pub }, priv, 256);
    const base = await subtle.importKey('raw', bits, 'HKDF', false, ['deriveKey']);
    return subtle.deriveKey(
      { name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(0), info: enc.encode('letter-v1') },
      base, { name: 'AES-GCM', length: 256 }, false, usage);
  }

  // Hybrid encryption to the manager: ephemeral ECDH -> HKDF -> AES-GCM (AAD = recipient fingerprint).
  async function encryptLetter(letter, mgrPub) {
    const pub = await checkPub(mgrPub);
    const eph = await subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveBits']);
    const recipient = await subtle.importKey('jwk', pub.enc, { name: 'ECDH', namedCurve: 'P-256' }, false, []);
    const aes = await deriveAes(eph.privateKey, recipient, ['encrypt']);
    const iv = rand(12);
    const ct = await subtle.encrypt({ name: 'AES-GCM', iv, additionalData: enc.encode(pub.fp) }, aes, enc.encode(canon(letter)));
    return { v: V, type: 'letter', to: pub.fp, epk: pubJwk(await subtle.exportKey('jwk', eph.publicKey)), iv: b64(iv), ct: b64(ct) };
  }

  async function decryptLetter(file, ident) {
    if (file?.v !== V || file.type !== 'letter') throw new Error('فایل نامه نامعتبر است');
    if (file.to !== ident.fp) throw new Error('این نامه برای کلید دیگری رمز شده است');
    const epk = await subtle.importKey('jwk', file.epk, { name: 'ECDH', namedCurve: 'P-256' }, false, []);
    const aes = await deriveAes(ident.encKey, epk, ['decrypt']);
    try {
      const pt = await subtle.decrypt({ name: 'AES-GCM', iv: unb64(file.iv), additionalData: enc.encode(ident.fp) }, aes, unb64(file.ct));
      return JSON.parse(dec.decode(pt));
    } catch {
      throw new Error('رمزگشایی ناموفق: فایل دستکاری شده است');
    }
  }

  // The signature covers the whole original letter + decision + note + signature image + time.
  async function signLetter(ident, { letter, decision, note, sigImage }) {
    const payload = {
      v: V, letter, decision, note, sigImage,
      signedAt: new Date().toISOString(),
      signer: { name: ident.name, fp: ident.fp },
    };
    const sig = await subtle.sign({ name: 'ECDSA', hash: 'SHA-256' }, ident.signKey, enc.encode(canon(payload)));
    return { v: V, type: 'signed', payload, sig: b64(sig) };
  }

  async function verifySigned(file, pinnedPub) {
    const fail = (reason) => ({ ok: false, reason });
    try {
      if (file?.v !== V || file.type !== 'signed' || !file.payload || !file.sig) return fail('فرمت فایل امضاشده نامعتبر است');
      const pub = await checkPub(pinnedPub);
      if (file.payload.signer?.fp !== pub.fp) return fail('امضاکننده با کلید ثبت‌شده‌ی مدیر مطابقت ندارد');
      const key = await subtle.importKey('jwk', pub.sign, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
      const ok = await subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, key, unb64(file.sig), enc.encode(canon(file.payload)));
      if (!ok) return fail('امضا نامعتبر است: محتوا دستکاری شده یا امضا جعلی است');
      return { ok: true, payload: file.payload, hash: await docHash(file.payload), fp: pub.fp };
    } catch (e) {
      return fail('بررسی ناموفق: ' + e.message);
    }
  }

  const docHash = async (payload) => (await sha256hex(canon(payload))).slice(0, 16);

  return { docHash, generateIdentity, unlockIdentity, checkPub, encryptLetter, decryptLetter, signLetter, verifySigned, fingerprint, sha256hex, uuid: () => globalThis.crypto.randomUUID() };
})();


</script>
<script>
// Helpers + canvas letter renderer shared by the employee and manager pages.
// All user text goes through textContent / canvas, never innerHTML.
const FONT = 'Vazirmatn, Tahoma, "Segoe UI", system-ui, sans-serif';
const DEFAULT_HEAD = { name: 'نام شرکت نمونه', sub: 'Sample Company Co.', address: 'تهران، خیابان نمونه، پلاک ۱ — تلفن: ۰۲۱-۰۰۰۰۰۰۰۰', logo: '' };
const DECISION_FA = { approved: 'تأیید شد', rejected: 'رد شد', revision: 'نیاز به اصلاح' };
// Paper (white) colours: palette hues, with darker shades where the light ones would be unreadable on white.
const PAPER = { ink: '#081528', brand: '#165EF6', mid: '#32568A', gold: '#BFA46F', ok: '#1F8F78', bad: '#D65959', warn: '#A8801F' };
const DECISION_COLOR = { approved: PAPER.ok, rejected: PAPER.bad, revision: PAPER.warn };
const $ = (id) => document.getElementById(id);

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { console.warn('storage read failed', e); return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { console.warn('storage write failed', e); return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { console.warn('storage delete failed', e); } },
};

function msg(id, text, kind = 'info') { const el = $(id); el.textContent = text; el.className = 'msg ' + (text ? kind : ''); }
const readJson = async (file) => { try { return JSON.parse(await file.text()); } catch { throw new Error('فایل خوانده نشد (JSON نامعتبر)'); } };
const readDataUrl = (file) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('خواندن فایل ناموفق بود')); r.readAsDataURL(file); });
const loadImg = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('تصویر بارگذاری نشد')); i.src = src; });

function download(name, blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
const downloadJson = (name, obj) => download(name, new Blob([JSON.stringify(obj)], { type: 'application/json' }));
const canvasBlob = (c) => new Promise((res) => c.toBlob(res, 'image/png'));
const safeName = (s) => s.replace(/[^\w\-]+/g, '_');

function jalali(d = new Date()) {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-u-ca-persian-nu-latn', { year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(d).map((x) => [x.type, x.value]));
  return `${p.year}/${p.month}/${p.day}`;
}
const ltr = (s) => `⁦${s}⁩`; // keep digits/hex in logical order inside RTL text
const timeHM = (d) => d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

// run async handlers; surface errors in a message box
const guard = (msgId, fn) => async (...a) => { try { await fn(...a); } catch (e) { console.error(e); msg(msgId, e.message || String(e), 'bad'); } };

function wrap(ctx, text, maxW) {
  const out = [];
  for (const para of String(text).split('\n')) {
    if (!para.trim()) { out.push(''); continue; }
    let line = '';
    for (const w of para.split(/\s+/)) {
      const t = line ? line + ' ' + w : w;
      if (line && ctx.measureText(t).width > maxW) { out.push(line); line = w; } else line = t;
    }
    out.push(line);
  }
  return out;
}

// letter = {no, rev, date, subject, body, head}; signed = {decision, note, sigImage, signerName, signedAt, fp, hash, verified}
async function renderLetter({ letter, signed }) {
  const W = 794, M = 56, SCALE = 2, LH = 28, INK = PAPER.ink;
  const head = letter.head || DEFAULT_HEAD;
  const logo = head.logo ? await loadImg(head.logo) : null;
  const sigImg = signed?.sigImage ? await loadImg(signed.sigImage) : null;

  const probe = document.createElement('canvas').getContext('2d');
  probe.direction = 'rtl'; probe.font = `16px ${FONT}`;
  const body = wrap(probe, letter.body, W - 2 * M);
  const note = signed?.note ? wrap(probe, signed.note, W - 2 * M) : [];

  let H = 150 + 90 + 40 + body.length * LH + 40;
  if (signed) H += 70 + note.length * 26 + 150 + 40;
  H = Math.max(1123, H + 90);

  const c = document.createElement('canvas');
  c.width = W * SCALE; c.height = H * SCALE;
  const g = c.getContext('2d');
  g.scale(SCALE, SCALE);
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  g.direction = 'rtl'; g.textBaseline = 'alphabetic';
  const R = W - M;
  const text = (s, x, y, { size = 16, bold = false, align = 'right', color = INK } = {}) => {
    g.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; g.fillStyle = color; g.textAlign = align; g.fillText(s, x, y);
  };
  const rule = (y, color = PAPER.brand, w = 1.5) => { g.strokeStyle = color; g.lineWidth = w; g.beginPath(); g.moveTo(M, y); g.lineTo(R, y); g.stroke(); };

  let textRight = R;
  if (logo) { const s = 72 / Math.max(logo.width, logo.height); g.drawImage(logo, R - logo.width * s, 36, logo.width * s, logo.height * s); textRight = R - logo.width * s - 16; }
  text(head.name, textRight, 64, { size: 24, bold: true, color: PAPER.brand });
  text(head.sub, textRight, 92, { size: 14, color: PAPER.mid });
  rule(122);
  rule(127, PAPER.gold, 1);

  const rev = letter.rev > 1 ? `  (ویرایش ${letter.rev})` : '';
  text(`شماره: ${ltr(letter.no)}${rev}`, R, 156, { size: 14 });
  text(`تاریخ: ${ltr(letter.date)}`, M, 156, { size: 14, align: 'left' });
  text(`موضوع: ${letter.subject}`, R, 196, { size: 17, bold: true });

  let y = 240;
  for (const l of body) { text(l, R, y); y += LH; }

  if (signed) {
    y += 20; rule(y, PAPER.gold, 1); y += 34;
    text(`نظر مدیر: ${DECISION_FA[signed.decision] || signed.decision}`, R, y, { size: 18, bold: true, color: DECISION_COLOR[signed.decision] || INK }); y += 30;
    for (const l of note) { text(l, R, y); y += 26; }
    y += 10;
    if (sigImg) {
      const s = Math.min(220 / sigImg.width, 90 / sigImg.height);
      g.drawImage(sigImg, M + 10, y, sigImg.width * s, sigImg.height * s);
    }
    const d = new Date(signed.signedAt);
    text(signed.signerName, M + 120, y + 112, { size: 14, bold: true, align: 'center' });
    text(`${ltr(jalali(d))}  ${ltr(timeHM(d))}`, M + 120, y + 134, { size: 12, color: PAPER.mid, align: 'center' });
    if (signed.verified) text('✔ امضای دیجیتال معتبر', R, y + 40, { size: 15, bold: true, color: PAPER.ok });
    text(`شناسه سند: ${ltr(signed.hash)}`, R, y + 72, { size: 11, color: PAPER.mid });
    text(`اثرانگشت امضاکننده: ${ltr(signed.fp)}`, R, y + 92, { size: 11, color: PAPER.mid });
  }

  rule(H - 56, PAPER.gold, 1);
  text(head.address, W / 2, H - 30, { size: 12, color: PAPER.mid, align: 'center' });
  return c;
}

const show = (containerId, canvas) => $(containerId).replaceChildren(canvas);
const signedView = (p, extra) => ({ ...p, signerName: p.signer.name, fp: p.signer.fp, ...extra });

</script>
<script>
// Manager page: unlock private key, open encrypted letter, approve / request revision / reject, sign.
let ident = null;
let openedLetter = null;

const refreshSignBtn = () => { $('signBtn').disabled = !(ident && openedLetter); };
const setUnlocked = () => msg('keyStatus', `باز است: ${ident.name} — اثرانگشت: ${ident.fp}`, 'ok');

$('unlock').addEventListener('click', guard('keyMsg', async () => {
  const f = $('keyFile').files[0];
  if (!f) throw new Error('فایل کلید را انتخاب کنید');
  msg('keyMsg', 'در حال باز کردن…', 'info');
  ident = await LC.unlockIdentity(await readJson(f), $('unlockPass').value);
  $('unlockPass').value = '';
  setUnlocked(); msg('keyMsg', '');
  refreshSignBtn();
}));

$('letterFile').addEventListener('change', guard('openMsg', async (e) => {
  const f = e.target.files[0]; if (!f) return;
  openedLetter = null; refreshSignBtn(); $('mgrPreview').replaceChildren();
  if (!ident) throw new Error('ابتدا کلید خود را باز کنید');
  openedLetter = await LC.decryptLetter(await readJson(f), ident);
  show('mgrPreview', await renderLetter({ letter: openedLetter }));
  msg('openMsg', openedLetter.rev > 1 ? `نامه با موفقیت باز شد (ویرایش ${openedLetter.rev})` : 'نامه با موفقیت باز شد', 'ok');
  refreshSignBtn();
}));

document.querySelectorAll('input[name=decision]').forEach((r) => r.addEventListener('change', () => {
  $('noteLabel').textContent = r.value === 'revision' && r.checked ? 'توضیح (الزامی): چه چیزی باید اصلاح شود؟' : 'توضیح (اختیاری)';
}));

// signature pad
const pad = $('pad'), pg = pad.getContext('2d');
let drawing = false, padDirty = false;
pg.lineWidth = 3; pg.lineCap = 'round'; pg.lineJoin = 'round'; pg.strokeStyle = '#0F203A';
const pos = (e) => { const r = pad.getBoundingClientRect(); return [(e.clientX - r.left) * pad.width / r.width, (e.clientY - r.top) * pad.height / r.height]; };
pad.addEventListener('pointerdown', (e) => { drawing = true; pad.setPointerCapture(e.pointerId); pg.beginPath(); pg.moveTo(...pos(e)); });
pad.addEventListener('pointermove', (e) => { if (!drawing) return; pg.lineTo(...pos(e)); pg.stroke(); padDirty = true; });
['pointerup', 'pointercancel'].forEach((t) => pad.addEventListener(t, () => { drawing = false; }));
const clearPad = () => { pg.clearRect(0, 0, pad.width, pad.height); padDirty = false; };
$('padClear').addEventListener('click', clearPad);
$('sigUpload').addEventListener('change', guard('signMsg', async (e) => {
  const f = e.target.files[0]; if (!f) return;
  const img = await loadImg(await readDataUrl(f));
  clearPad();
  const s = Math.min(pad.width / img.width, pad.height / img.height);
  pg.drawImage(img, (pad.width - img.width * s) / 2, (pad.height - img.height * s) / 2, img.width * s, img.height * s);
  padDirty = true;
}));

$('signBtn').addEventListener('click', guard('signMsg', async () => {
  const decision = document.querySelector('input[name=decision]:checked').value;
  const note = $('note').value.trim();
  if (decision === 'revision' && !note) throw new Error('برای «نیاز به اصلاح» توضیح بنویسید');
  if (!padDirty) throw new Error('تصویر امضا را بکشید یا بارگذاری کنید');
  const signed = await LC.signLetter(ident, { letter: openedLetter, decision, note, sigImage: pad.toDataURL('image/png') });
  downloadJson(`signed-${safeName(openedLetter.no)}-v${openedLetter.rev || 1}.signed`, signed);
  const p = signed.payload;
  show('mgrPreview', await renderLetter({ letter: p.letter, signed: signedView(p, { hash: await LC.docHash(p), verified: false }) }));
  msg('signMsg', 'نامه امضا شد؛ فایل .signed را برای تیم اداری بفرستید', 'ok');
}));

</script>
</body>
