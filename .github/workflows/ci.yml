name: ci

# Runs only for pull requests into main.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  server:
    name: Server
    uses: CtrlAltDevelop/ci-workflows/.github/workflows/python-test.yml@v1.2.0
    permissions:
      contents: read
    with:
      working-directory: server
      python-version: "3.13"
      install: uv sync --frozen
      test-command: uv run --no-sync pytest -q
      env: |
        DJANGO_DEBUG=1

  # No shared Node workflow exists: this is the only caller, so it stays inline.
  js:
    name: JS
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
