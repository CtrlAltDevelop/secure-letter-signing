[project]
name = "server"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "celery>=5.7.0",
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "cryptography>=50.0.2",
    "daphne>=4.2.3",
    "django>=6.1.3",
    "django-ninja>=1.8.0",
    "django-unfold>=0.110.1",
    "google-auth>=2.63.1",
    "psycopg[binary]>=3.3.9",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "redis>=8.1.0",
    "requests>=2.34.2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
