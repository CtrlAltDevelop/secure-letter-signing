<div class="card">
  <h2>۱. کلید عمومی مدیر</h2>
  <div id="pubStatus" class="msg info">هنوز کلیدی ثبت نشده است.</div>
  <label>فایل <code>.pub</code> که مدیر داده است</label>
  <input type="file" id="pubFile" accept=".pub,application/json">
  <div class="row"><button id="pubClear" class="hidden">حذف کلید ثبت‌شده</button></div>
  <div class="msg info" style="display:block">پس از ثبت، اثرانگشت را تلفنی با مدیر تطبیق دهید تا مطمئن شوید کلید جایگزین نشده است.</div>
</div>

<div class="card">
  <details>
    <summary>تنظیم سربرگ نامه</summary>
    <label>نام شرکت</label><input type="text" id="hName">
    <label>زیرعنوان</label><input type="text" id="hSub">
    <label>آدرس / تلفن (پایین نامه)</label><input type="text" id="hAddr">
    <label>لوگو (PNG/JPG، اختیاری)</label><input type="file" id="hLogo" accept="image/*">
    <div class="row"><button id="hSave" class="primary">ذخیره</button><button id="hLogoClear">حذف لوگو</button></div>
    <div id="hMsg" class="msg"></div>
  </details>
</div>

<div class="card">
  <h2 id="editorTitle">۲. نامه‌ی جدید</h2>
  <div id="revBanner" class="msg"></div>
  <label>موضوع</label><input type="text" id="subject">
  <label>متن نامه</label><textarea id="body"></textarea>
  <div class="row">
    <button id="mkPreview" class="primary">پیش‌نمایش نامه</button>
    <button id="dlLetter" disabled>دانلود فایل رمزشده برای مدیر (.letter)</button>
    <button id="dlLetterPng" disabled>دانلود عکس نامه (PNG)</button>
    <button id="newLetter">شروع نامه‌ی جدید</button>
  </div>
  <div id="adminMsg" class="msg"></div>
  <div id="letterPreview" class="preview"></div>
</div>

<div class="card">
  <h2>۳. بررسی نامه‌ی امضاشده‌ی مدیر</h2>
  <label>فایل <code>.signed</code> که مدیر فرستاده است</label>
  <input type="file" id="signedFile" accept=".signed,application/json">
  <div id="verifyMsg" class="msg"></div>
  <div class="row">
    <button id="printSigned" disabled>چاپ</button>
    <button id="dlSignedPng" disabled>دانلود عکس (PNG)</button>
    <button id="reviseBtn" class="primary hidden">ویرایش و ارسال مجدد</button>
  </div>
  <div id="signedPreview" class="preview"></div>
</div>
<div id="printArea"><img id="printImg" alt=""></div>
