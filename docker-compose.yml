# One company per deployment. Usage: ./build.sh <brand> up
# Brand files are mounted read-only; secrets come from brands/<brand>/.env (git-ignored).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: letters
      POSTGRES_USER: letters
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in brands/<brand>/.env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U letters"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  # Online meetings (optional): set LIVEKIT_API_KEY/LIVEKIT_API_SECRET and LIVEKIT_PUBLIC_URL (wss://host:7880 or the
  # TLS proxy URL) in brands/<brand>/.env. Open 7880/tcp, 7881/tcp and 50000-50100/udp on the host firewall.
  livekit:
    image: livekit/livekit-server:latest
    profiles: ["meetings"]
    command: --bind 0.0.0.0
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: true
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"

  server:
    build: ./server
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      BRAND: ${BRAND:?}
      BRANDS_DIR: /brands
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in brands/<brand>/.env}
      DJANGO_DATA_KEY: ${DJANGO_DATA_KEY:?set DJANGO_DATA_KEY in brands/<brand>/.env}
      DJANGO_SEAL_SEED: ${DJANGO_SEAL_SEED:?set DJANGO_SEAL_SEED in brands/<brand>/.env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      DJANGO_HTTPS: ${DJANGO_HTTPS:-0}  # set 1 (and NUM_PROXIES=1) behind a TLS-terminating proxy
      NUM_PROXIES: ${NUM_PROXIES:-0}
      LIVEKIT_URL: ${LIVEKIT_PUBLIC_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    volumes:
      - ./brands:/brands:ro
      - attachments:/app/attachments
    ports:
      - "${SERVER_PORT:-8000}:8000"

volumes:
  dbdata:
  attachments:
