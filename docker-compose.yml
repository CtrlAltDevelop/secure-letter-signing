# One company per deployment. Usage: ./build.sh <brand> up
# Brand files are mounted read-only; secrets come from brands/<brand>/.env (git-ignored).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: letters
      POSTGRES_USER: letters
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in brands/<brand>/.env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in brands/<brand>/.env}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./scripts/db:/docker-entrypoint-initdb.d:ro  # creates the non-owner role `letters_app` (first start only)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U letters"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  # Online meetings (optional): set LIVEKIT_API_KEY/LIVEKIT_API_SECRET and LIVEKIT_PUBLIC_URL (wss://host:7880 or the
  # TLS proxy URL) in brands/<brand>/.env. Open 7880/tcp, 7881/tcp and 50000-50100/udp on the host firewall.
  livekit:
    image: livekit/livekit-server:latest
    profiles: ["meetings"]
    command: --bind 0.0.0.0
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: true
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"

  server:
    build: ./server
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      BRAND: ${BRAND:?}
      BRANDS_DIR: /brands
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in brands/<brand>/.env}
      DJANGO_DATA_KEY: ${DJANGO_DATA_KEY:?set DJANGO_DATA_KEY in brands/<brand>/.env}
      DJANGO_SEAL_SEED: ${DJANGO_SEAL_SEED:?set DJANGO_SEAL_SEED in brands/<brand>/.env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_HOST: db
      POSTGRES_USER: letters_app  # non-owner role: cannot alter schema or drop the immutability triggers
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      OWNER_DB_PASSWORD: ${POSTGRES_PASSWORD}  # used only by `migrate` below
      REDIS_URL: redis://redis:6379/0
      DJANGO_HTTPS: ${DJANGO_HTTPS:-0}  # set 1 (and NUM_PROXIES=1) behind a TLS-terminating proxy
      NUM_PROXIES: ${NUM_PROXIES:-0}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}  # push: also mount the service-account JSON and set FCM_SERVICE_ACCOUNT_FILE
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-}
      LIVEKIT_URL: ${LIVEKIT_PUBLIC_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    # Migrations need the owner role; the server process itself runs as letters_app.
    command: ["sh", "-c", "POSTGRES_USER=letters POSTGRES_PASSWORD=$$OWNER_DB_PASSWORD python manage.py migrate --noinput && exec daphne -v 0 -b 0.0.0.0 -p 8000 config.asgi:application"]
    volumes:
      - ./brands:/brands:ro
      - attachments:/app/attachments
    # Plain HTTP by default; the optional `nginx` service (profile `proxy`) adds TLS, the 30m body cap and /ws log scrubbing.
    # daphne runs with -v 0 (no access log).
    ports:
      - "${SERVER_PORT:-8000}:8000"

  # TLS proxy (optional): `docker compose --profile proxy up`; set DJANGO_HTTPS=1 and NUM_PROXIES=1 in brands/<brand>/.env.
  # Needs ${TLS_CERT_DIR}/fullchain.pem and privkey.pem (see docs/security.md for a self-signed command).
  nginx:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    depends_on: [server]
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_DIR:-./deploy/certs}:/certs:ro

volumes:
  dbdata:
  attachments:
