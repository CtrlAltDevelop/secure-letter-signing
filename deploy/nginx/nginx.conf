# TLS-terminating proxy (compose profile `proxy`). Logs `$uri`, never `$request`/`$request_uri`, so the /ws ?token= never lands in a log.
worker_processes auto;
events { worker_connections 1024; }

http {
    log_format scrubbed '$remote_addr [$time_local] $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout scrubbed;
    error_log /dev/stderr warn;

    client_max_body_size 30m;  # attachments are capped at 25 MB

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen 80;
        return 301 https://$host$request_uri;  # redirect only: no query-string logging (access_log uses $uri)
    }

    server {
        listen 443 ssl;
        ssl_certificate     /certs/fullchain.pem;
        ssl_certificate_key /certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location /ws/ {
            proxy_pass http://server:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 1h;
        }

        location / {
            proxy_pass http://server:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
